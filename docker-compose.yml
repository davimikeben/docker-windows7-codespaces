# 🪟 Windows 7 em Docker — espelho de compose.yml (compatibilidade com "docker-compose")
# Conteúdo idêntico ao compose.yml. Se alterar um, altere o outro.
# Uso: cp .env.example .env && docker-compose up -d

services:
  windows:
    image: dockurr/windows:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: win7
    environment:
      VERSION: ${VERSION:-7u}
      LANGUAGE: ${LANGUAGE:-Portuguese}
      REGION: ${REGION:-pt-BR}
      KEYBOARD: ${KEYBOARD:-pt-BR}
      RAM_SIZE: ${RAM_SIZE:-4G}
      CPU_CORES: ${CPU_CORES:-2}
      DISK_SIZE: ${DISK_SIZE:-30G}
      USERNAME: ${USERNAME:-Docker}
      PASSWORD: ${PASSWORD:-admin}
      AUDIO: ${AUDIO:-Y}
      TZ: ${TZ:-America/Sao_Paulo}
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./windows:/storage
      - ./shared:/shared
      - ./oem:/oem
      # - ./custom.iso:/custom.iso
    restart: unless-stopped
    stop_grace_period: 2m
